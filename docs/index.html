<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .stat-value.positive {
            color: var(--accent-green);
        }

        .stat-value.negative {
            color: var(--accent-red);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .chart-card h2 {
            font-size: 1.125rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .positions-table {
            width: 100%;
            border-collapse: collapse;
        }

        .positions-table th,
        .positions-table td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--bg-card);
        }

        .positions-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        .positions-table td:last-child {
            text-align: right;
        }

        .bar {
            height: 8px;
            background: var(--accent-blue);
            border-radius: 4px;
            margin-top: 0.25rem;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--bg-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio Tracker</h1>
        <p class="subtitle">Updated: <span id="lastUpdate"></span></p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Index Value</div>
                <div class="stat-value" id="indexValue">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Return</div>
                <div class="stat-value" id="totalReturn">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Period Return</div>
                <div class="stat-value" id="periodReturn">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Invested</div>
                <div class="stat-value" id="investedPct">-</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Portfolio Index (Baseline = 100)</h2>
                <div class="chart-container">
                    <canvas id="indexChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Monthly Returns</h2>
                <div class="chart-container">
                    <canvas id="returnsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Current Allocation</h2>
                <div class="chart-container">
                    <canvas id="allocationChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Allocation Over Time</h2>
                <div class="chart-container">
                    <canvas id="allocationHistoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <h2>Current Positions</h2>
            <table class="positions-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Allocation</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="positionsTable">
                </tbody>
            </table>
        </div>

        <footer>
            <p>Data shows percentages only. No actual values are displayed.</p>
        </footer>
    </div>

    <script>
        const data = {"dates": ["Jul 15 '24", "Jul 20 '24", "Jul 25 '24", "Aug 04 '24", "Aug 14 '24", "Aug 24 '24", "Sep 05 '24", "Sep 14 '24", "Sep 27 '24", "Oct 04 '24", "Oct 10 '24", "Oct 23 '24", "Nov 05 '24", "Nov 11 '24", "Nov 22 '24", "Nov 30 '24", "Dec 06 '24", "Dec 12 '24", "Dec 18 '24", "Dec 23 '24", "Dec 30 '24", "Jan 06 '25", "Jan 19 '25", "Jan 30 '25", "Feb 04 '25"], "rawDates": ["20240715", "20240720", "20240725", "20240804", "20240814", "20240824", "20240905", "20240914", "20240927", "20241004", "20241010", "20241023", "20241105", "20241111", "20241122", "20241130", "20241206", "20241212", "20241218", "20241223", "20241230", "20250106", "20250119", "20250130", "20250204"], "indexValues": [100.0, 102.16, 103.62, 106.12, 103.73, 105.8, 106.22, 107.54, 109.55, 104.99, 105.53, 104.93, 111.29, 115.77, 122.54, 121.54, 119.15, 120.62, 123.17, 121.17, 117.23, 116.56, 117.29, 116.15, 114.14], "returns": [null, 2.16, 1.43, 2.41, -2.25, 2.0, 0.4, 1.24, 1.87, -4.16, 0.51, -0.57, 6.06, 4.03, 5.85, -0.82, -1.97, 1.23, 2.11, -1.62, -3.25, -0.57, 0.63, -0.97, -1.73], "cashPcts": [13.95, 22.45, 28.16, 20.07, 25.8, 18.57, 25.87, 18.42, 21.12, 12.52, 12.82, 23.27, 25.68, 20.1, 23.27, 25.88, 25.63, 28.23, 22.02, 21.33, 12.08, 13.46, 18.85, 21.76, 23.34], "otherPcts": [8.45, 8.07, 7.73, 8.06, 8.38, 8.01, 8.44, 8.61, 8.65, 8.7, 8.98, 9.63, 9.67, 9.57, 10.01, 10.83, 10.33, 9.96, 10.37, 11.08, 10.33, 10.16, 9.92, 10.98, 10.56], "topSymbols": ["AAPL", "MSFT", "GOOGL", "AMZN", "META", "NVDA"], "allocationSeries": {"AAPL": [21.77, 20.43, 18.62, 20.59, 17.9, 20.59, 17.76, 21.07, 19.29, 21.11, 20.09, 17.3, 17.52, 19.1, 20.57, 19.64, 19.96, 20.28, 22.26, 22.27, 22.38, 19.99, 19.17, 17.8, 13.92], "MSFT": [17.84, 16.66, 14.7, 16.29, 14.47, 17.04, 18.32, 20.53, 19.95, 21.85, 20.12, 16.09, 14.67, 15.76, 14.8, 14.82, 15.56, 15.74, 17.92, 17.48, 21.73, 19.81, 18.76, 18.1, 18.06], "GOOGL": [14.1, 12.01, 10.36, 12.06, 11.77, 12.51, 11.27, 10.64, 9.37, 10.58, 10.19, 9.8, 8.86, 10.64, 10.36, 9.28, 8.64, 7.54, 7.29, 7.99, 8.69, 9.19, 7.41, 7.92, 7.89], "AMZN": [10.73, 9.15, 8.62, 9.01, 8.53, 8.27, 7.04, 6.9, 7.4, 8.85, 10.28, 9.65, 9.19, 10.21, 8.48, 7.7, 8.23, 8.5, 9.66, 10.03, 13.14, 12.17, 10.56, 9.97, 9.49], "META": [5.09, 3.34, 4.35, 4.97, 4.95, 5.22, 3.38, 4.77, 7.32, 11.16, 11.71, 9.06, 10.64, 10.52, 9.29, 9.14, 7.75, 6.23, 7.57, 7.08, 8.21, 7.56, 7.52, 7.33, 7.65], "NVDA": [8.52, 7.51, 7.12, 9.28, 8.52, 9.42, 8.35, 9.23, 6.94, 5.28, 6.09, 5.85, 3.81, 4.0, 3.66, 3.53, 3.4, 3.15, 3.32, 3.45, 2.69, 3.18, 3.01, 2.25, 2.3]}, "currentAllocation": [{"symbol": "MSFT", "pct": 18.06}, {"symbol": "AAPL", "pct": 13.92}, {"symbol": "AMZN", "pct": 9.49}, {"symbol": "GOOGL", "pct": 7.89}, {"symbol": "META", "pct": 7.65}, {"symbol": "TSLA", "pct": 6.37}, {"symbol": "NVDA", "pct": 2.3}, {"symbol": "Other Positions", "pct": 10.56}, {"symbol": "Cash", "pct": 23.34}], "latest": {"date": "20250204", "indexValue": 114.14, "totalReturn": 14.14, "periodReturn": -1.73, "investedPct": 76.66, "cashPct": 23.34}};

        // Update stats
        if (data.latest) {
            document.getElementById('lastUpdate').textContent = data.latest.date;
            document.getElementById('indexValue').textContent = data.latest.indexValue.toFixed(2);

            const totalReturnEl = document.getElementById('totalReturn');
            if (data.latest.totalReturn !== null) {
                const sign = data.latest.totalReturn >= 0 ? '+' : '';
                totalReturnEl.textContent = sign + data.latest.totalReturn.toFixed(2) + '%';
                totalReturnEl.className = 'stat-value ' + (data.latest.totalReturn >= 0 ? 'positive' : 'negative');
            }

            const periodReturnEl = document.getElementById('periodReturn');
            if (data.latest.periodReturn !== null) {
                const sign = data.latest.periodReturn >= 0 ? '+' : '';
                periodReturnEl.textContent = sign + data.latest.periodReturn.toFixed(2) + '%';
                periodReturnEl.className = 'stat-value ' + (data.latest.periodReturn >= 0 ? 'positive' : 'negative');
            }

            document.getElementById('investedPct').textContent = data.latest.investedPct.toFixed(1) + '%';
        }

        // Populate positions table
        const tbody = document.getElementById('positionsTable');
        data.currentAllocation.forEach(pos => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${pos.symbol}</td>
                <td>
                    <div>${pos.pct.toFixed(2)}%</div>
                    <div class="bar" style="width: ${Math.min(pos.pct, 100)}%"></div>
                </td>
                <td></td>
            `;
            tbody.appendChild(tr);
        });

        // Chart.js defaults
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        // Index Chart
        new Chart(document.getElementById('indexChart'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [{
                    label: 'Index Value',
                    data: data.indexValues,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    annotation: {
                        annotations: {
                            baseline: {
                                type: 'line',
                                yMin: 100,
                                yMax: 100,
                                borderColor: '#64748b',
                                borderDash: [5, 5],
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                    }
                }
            }
        });

        // Returns Chart
        new Chart(document.getElementById('returnsChart'), {
            type: 'bar',
            data: {
                labels: data.dates,
                datasets: [{
                    label: 'Return %',
                    data: data.returns,
                    backgroundColor: data.returns.map(r => r >= 0 ? '#22c55e' : '#ef4444'),
                    borderRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                    }
                }
            }
        });

        // Allocation Pie Chart
        const pieColors = [
            '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
            '#06b6d4', '#6366f1', '#d946ef', '#f97316', '#14b8a6',
            '#64748b', '#22c55e'
        ];

        new Chart(document.getElementById('allocationChart'), {
            type: 'doughnut',
            data: {
                labels: data.currentAllocation.map(p => p.symbol),
                datasets: [{
                    data: data.currentAllocation.map(p => p.pct),
                    backgroundColor: pieColors.slice(0, data.currentAllocation.length),
                    borderWidth: 0,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                    },
                },
            }
        });

        // Allocation History (Stacked Area)
        const stackedDatasets = [];
        let colorIdx = 0;

        data.topSymbols.forEach(symbol => {
            stackedDatasets.push({
                label: symbol,
                data: data.allocationSeries[symbol],
                backgroundColor: pieColors[colorIdx % pieColors.length],
                fill: true,
                tension: 0.3,
            });
            colorIdx++;
        });

        stackedDatasets.push({
            label: 'Other Positions',
            data: data.otherPcts,
            backgroundColor: '#64748b',
            fill: true,
            tension: 0.3,
        });

        stackedDatasets.push({
            label: 'Cash',
            data: data.cashPcts,
            backgroundColor: '#22c55e',
            fill: true,
            tension: 0.3,
        });

        new Chart(document.getElementById('allocationHistoryChart'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: stackedDatasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                    },
                },
                scales: {
                    y: {
                        stacked: true,
                        max: 100,
                    },
                    x: {
                        stacked: true,
                    }
                }
            }
        });
    </script>
</body>
</html>
