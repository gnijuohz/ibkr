<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 600;
        }

        .stat-value.positive {
            color: var(--accent-green);
        }

        .stat-value.negative {
            color: var(--accent-red);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .chart-card h2 {
            font-size: 1.125rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .positions-table {
            width: 100%;
            border-collapse: collapse;
        }

        .positions-table th,
        .positions-table td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--bg-card);
        }

        .positions-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }

        .positions-table td:last-child {
            text-align: right;
        }

        .bar {
            height: 8px;
            background: var(--accent-blue);
            border-radius: 4px;
            margin-top: 0.25rem;
        }

        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--bg-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portfolio Tracker</h1>
        <p class="subtitle">Updated: <span id="lastUpdate"></span></p>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Index Value</div>
                <div class="stat-value" id="indexValue">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Return</div>
                <div class="stat-value" id="totalReturn">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Period Return</div>
                <div class="stat-value" id="periodReturn">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Invested</div>
                <div class="stat-value" id="investedPct">-</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h2>Portfolio Index (Baseline = 100)</h2>
                <div class="chart-container">
                    <canvas id="indexChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Monthly Returns</h2>
                <div class="chart-container">
                    <canvas id="returnsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Current Allocation</h2>
                <div class="chart-container">
                    <canvas id="allocationChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>Allocation Over Time</h2>
                <div class="chart-container">
                    <canvas id="allocationHistoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <h2>Current Positions</h2>
            <table class="positions-table">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Allocation</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="positionsTable">
                </tbody>
            </table>
        </div>

        <footer>
            <p>Data shows percentages only. No actual values are displayed.</p>
        </footer>
    </div>

    <script>
        const data = {"dates": ["Jan 2025", "Feb 2025", "Mar 2025", "Apr 2025", "May 2025", "Jun 2025", "Jul 2025", "Aug 2025", "Sep 2025", "Oct 2025", "Nov 2025", "Dec 2025"], "rawDates": ["20250101", "20250201", "20250301", "20250401", "20250501", "20250601", "20250701", "20250801", "20250901", "20251001", "20251101", "20251201"], "indexValues": [100.0, 103.2, 101.5, 108.7, 112.3, 115.8, 111.2, 118.5, 122.8, 128.5, 119.2, 125.8], "returns": [null, 3.2, -1.65, 7.09, 3.31, 3.12, -3.97, 6.56, 3.63, 4.64, -7.24, 5.54], "cashPcts": [25.0, 23.0, 22.0, 20.0, 18.0, 17.0, 19.0, 17.0, 16.0, 14.0, 18.0, 15.0], "otherPcts": [8.0, 9.0, 10.0, 11.5, 12.0, 12.4, 12.3, 12.0, 13.0, 13.5, 12.8, 12.0], "topSymbols": ["MSFT", "AAPL", "NVDA", "AMZN", "GOOGL", "META"], "allocationSeries": {"MSFT": [15.2, 14.8, 15.5, 16.0, 16.5, 17.2, 16.8, 17.5, 18.2, 19.0, 18.5, 19.2], "AAPL": [18.5, 19.2, 17.8, 16.5, 15.8, 14.5, 14.2, 15.0, 14.8, 13.5, 14.0, 14.5], "NVDA": [7.3, 8.5, 10.2, 12.5, 14.2, 15.8, 14.5, 13.8, 14.5, 15.8, 13.5, 14.8], "AMZN": [8.5, 9.0, 8.8, 9.2, 9.8, 10.5, 10.2, 11.0, 11.5, 12.2, 11.8, 12.5], "GOOGL": [12.0, 11.5, 10.2, 9.8, 9.5, 8.8, 9.0, 9.2, 8.5, 8.0, 8.2, 8.5], "META": [5.5, 5.0, 5.5, 4.5, 4.2, 3.8, 4.0, 4.5, 0, 0, 0, 0]}, "currentAllocation": [{"symbol": "AAPL", "pct": 14.5}, {"symbol": "MSFT", "pct": 19.2}, {"symbol": "GOOGL", "pct": 8.5}, {"symbol": "AMZN", "pct": 12.5}, {"symbol": "NVDA", "pct": 14.8}, {"symbol": "TSLA", "pct": 3.5}, {"symbol": "Other Positions", "pct": 12.0}, {"symbol": "Cash", "pct": 15.0}], "latest": {"date": "20251201", "indexValue": 125.8, "totalReturn": 25.8, "periodReturn": 5.54, "investedPct": 85.0, "cashPct": 15.0}};

        // Update stats
        if (data.latest) {
            document.getElementById('lastUpdate').textContent = data.latest.date;
            document.getElementById('indexValue').textContent = data.latest.indexValue.toFixed(2);

            const totalReturnEl = document.getElementById('totalReturn');
            if (data.latest.totalReturn !== null) {
                const sign = data.latest.totalReturn >= 0 ? '+' : '';
                totalReturnEl.textContent = sign + data.latest.totalReturn.toFixed(2) + '%';
                totalReturnEl.className = 'stat-value ' + (data.latest.totalReturn >= 0 ? 'positive' : 'negative');
            }

            const periodReturnEl = document.getElementById('periodReturn');
            if (data.latest.periodReturn !== null) {
                const sign = data.latest.periodReturn >= 0 ? '+' : '';
                periodReturnEl.textContent = sign + data.latest.periodReturn.toFixed(2) + '%';
                periodReturnEl.className = 'stat-value ' + (data.latest.periodReturn >= 0 ? 'positive' : 'negative');
            }

            document.getElementById('investedPct').textContent = data.latest.investedPct.toFixed(1) + '%';
        }

        // Populate positions table
        const tbody = document.getElementById('positionsTable');
        data.currentAllocation.forEach(pos => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${pos.symbol}</td>
                <td>
                    <div>${pos.pct.toFixed(2)}%</div>
                    <div class="bar" style="width: ${Math.min(pos.pct, 100)}%"></div>
                </td>
                <td></td>
            `;
            tbody.appendChild(tr);
        });

        // Chart.js defaults
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#334155';

        // Index Chart
        new Chart(document.getElementById('indexChart'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [{
                    label: 'Index Value',
                    data: data.indexValues,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointHoverRadius: 6,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    annotation: {
                        annotations: {
                            baseline: {
                                type: 'line',
                                yMin: 100,
                                yMax: 100,
                                borderColor: '#64748b',
                                borderDash: [5, 5],
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                    }
                }
            }
        });

        // Returns Chart
        new Chart(document.getElementById('returnsChart'), {
            type: 'bar',
            data: {
                labels: data.dates,
                datasets: [{
                    label: 'Return %',
                    data: data.returns,
                    backgroundColor: data.returns.map(r => r >= 0 ? '#22c55e' : '#ef4444'),
                    borderRadius: 4,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                },
                scales: {
                    y: {
                        beginAtZero: true,
                    }
                }
            }
        });

        // Allocation Pie Chart
        const pieColors = [
            '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981',
            '#06b6d4', '#6366f1', '#d946ef', '#f97316', '#14b8a6',
            '#64748b', '#22c55e'
        ];

        new Chart(document.getElementById('allocationChart'), {
            type: 'doughnut',
            data: {
                labels: data.currentAllocation.map(p => p.symbol),
                datasets: [{
                    data: data.currentAllocation.map(p => p.pct),
                    backgroundColor: pieColors.slice(0, data.currentAllocation.length),
                    borderWidth: 0,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                    },
                },
            }
        });

        // Allocation History (Stacked Area)
        const stackedDatasets = [];
        let colorIdx = 0;

        data.topSymbols.forEach(symbol => {
            stackedDatasets.push({
                label: symbol,
                data: data.allocationSeries[symbol],
                backgroundColor: pieColors[colorIdx % pieColors.length],
                fill: true,
                tension: 0.3,
            });
            colorIdx++;
        });

        stackedDatasets.push({
            label: 'Other Positions',
            data: data.otherPcts,
            backgroundColor: '#64748b',
            fill: true,
            tension: 0.3,
        });

        stackedDatasets.push({
            label: 'Cash',
            data: data.cashPcts,
            backgroundColor: '#22c55e',
            fill: true,
            tension: 0.3,
        });

        new Chart(document.getElementById('allocationHistoryChart'), {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: stackedDatasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                    },
                },
                scales: {
                    y: {
                        stacked: true,
                        max: 100,
                    },
                    x: {
                        stacked: true,
                    }
                }
            }
        });
    </script>
</body>
</html>
